name: "Relic"
run-name: "dill"
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  Column:
    concurrency:
      group: "FLORA-${{ github.workflow }}"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    environment:
      name: "github-pages"
      url: ${{ steps.lynx.outputs.page_url }}
    steps:
      - name: "xeric"
        uses: actions/checkout@v6
      - name: "Willowbrook"
        uses: actions/configure-pages@v6
      - name: "ivory"
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ github.workspace }}
      - name: "Kelpy"
        id: lynx
        uses: actions/deploy-pages@v5
